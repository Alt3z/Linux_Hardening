ansible_user: user
ansible_password: "{{ vault_ansible_password }}"
ansible_become_password: "{{ vault_ansible_become_password }}"

ansible_ssh_private_key_file: "{{ playbook_dir }}/../files/ssh_keys/linux_hardening_key"

ssh_hardening_pubkey_file: "{{ playbook_dir }}/../files/ssh_keys/linux_hardening_key.pub"

# Дополнительные пользователи, которым разрешён SSH-доступ, помимо ansible_user
ssh_hardening_extra_allow_users: ["qwerty", "test_user"]

# Единый источник правды для sshd_config — используется и при настройке, и при проверке
ssh_hardening_expected:
  LogLevel: VERBOSE
  PermitRootLogin: "no"
  PubkeyAuthentication: "yes"
  AuthorizedKeysFile: ".ssh/authorized_keys"
  PasswordAuthentication: "no"
  PermitEmptyPasswords: "no"
  KbdInteractiveAuthentication: "no"
  UsePAM: "yes"
  X11Forwarding: "no"
  PrintMotd: "no"

ssh_hardening_accept_env: "LANG LC_*"
ssh_hardening_sftp_subsystem: "sftp /usr/lib/openssh/sftp-server"

ssh_hardening_key_passphrase: "{{ vault_ssh_key_passphrase }}"

fail2ban_sshd_settings:
  enabled: "true"
  port: "ssh"
  filter: "sshd"
  logpath: "/var/log/auth.log"
  maxretry: "5"
  bantime: "3600"

kaspersky_services:
  - kesl
  - klnagent64

iptables_service_candidates:
  - netfilter-persistent
  - iptables

login_defs_target:
  PASS_MAX_DAYS: 90
  PASS_MIN_DAYS: 7
  PASS_WARN_AGE: 14
  ENCRYPT_METHOD: SHA512

pam_pwquality_target:
  control: requisite
  retry: 3
  minlen: 12
  ucredit: -1
  lcredit: -1
  dcredit: -1
  ocredit: -1

glpi_agent_version: "1.19"
glpi_agent_installer_url: "https://github.com/glpi-project/glpi-agent/releases/download/{{ glpi_agent_version }}/glpi-agent-{{ glpi_agent_version }}-linux-installer.pl"

glpi_agent_server: "192.168.56.10"
glpi_agent_httpd_trust:
  - "192.168.56.10"
  - "localhost"
glpi_agent_no_ssl_check: 1

zabbix_server_ip: "192.168.56.101"

wazuh_manager_ip: "192.168.56.105"
wazuh_agent_version: "4.7.5-1"
wazuh_agent_deb_url: "https://packages.wazuh.com/4.x/apt/pool/main/w/wazuh-agent/wazuh-agent_{{ wazuh_agent_version }}_amd64.deb"
