---
- name: Ensure per-host reports directory exists
  ansible.builtin.file:
    path: "{{ packages_reports_dir }}/{{ inventory_hostname }}"
    state: directory
  delegate_to: localhost
  become: false

- name: Collect package facts
  ansible.builtin.package_facts:
    manager: apt

- name: Generate packages report
  ansible.builtin.template:
    src: packages_report.j2
    dest: "{{ packages_reports_dir }}/{{ inventory_hostname }}/packages.txt"
  delegate_to: localhost
  become: false
