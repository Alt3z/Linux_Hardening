---
- name: Ensure local directory for keys exists
  ansible.builtin.file:
    path: "{{ ssh_keygen_local_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  run_once: true

- name: Generate ED25519 keypair on control node (idempotent — skips if it already exists)
  community.crypto.openssh_keypair:
    path: "{{ ssh_keygen_local_dir }}/{{ ssh_keygen_key_name }}"
    type: ed25519
    comment: "{{ ssh_keygen_comment }}"
    passphrase: ""
  delegate_to: localhost
  become: false
  run_once: true
