---
- name: Ensure per-host reports directory exists
  ansible.builtin.file:
    path: "{{ password_policy_reports_dir }}/{{ inventory_hostname }}"
    state: directory
  delegate_to: localhost
  become: false

- name: Check pam_pwquality module is installed
  ansible.builtin.stat:
    path: /usr/lib/x86_64-linux-gnu/security/pam_pwquality.so
  register: pam_pwquality_installed

- name: Read /etc/pam.d/common-password
  ansible.builtin.command: cat /etc/pam.d/common-password
  register: common_password_result
  changed_when: false

- name: Extract the pam_pwquality line
  ansible.builtin.set_fact:
    pam_pwquality_line: >-
      {{
        common_password_result.stdout_lines
        | select('match', '^\s*password\s+\S+\s+pam_pwquality\.so')
        | list
        | first
        | default('')
      }}

- name: Parse actual PAM parameters from the line
  ansible.builtin.set_fact:
    pam_pwquality_actual:
      control: "{{ pam_pwquality_line.split()[1] if (pam_pwquality_line.split() | length > 1) else '' }}"
      retry: "{{ (pam_pwquality_line | regex_search('retry=(\\S+)', '\\1') | default([], true) | first | default('') ) }}"
      minlen: "{{ (pam_pwquality_line | regex_search('minlen=(\\S+)', '\\1') | default([], true) | first | default('') ) }}"
      ucredit: "{{ (pam_pwquality_line | regex_search('ucredit=(\\S+)', '\\1') | default([], true) | first | default('') ) }}"
      lcredit: "{{ (pam_pwquality_line | regex_search('lcredit=(\\S+)', '\\1') | default([], true) | first | default('') ) }}"
      dcredit: "{{ (pam_pwquality_line | regex_search('dcredit=(\\S+)', '\\1') | default([], true) | first | default('') ) }}"
      ocredit: "{{ (pam_pwquality_line | regex_search('ocredit=(\\S+)', '\\1') | default([], true) | first | default('') ) }}"

- name: Evaluate compliance for each PAM parameter
  ansible.builtin.set_fact:
    pam_pwquality_checks:
      line_present:
        value: "{{ 'найдена' if pam_pwquality_line else 'отсутствует' }}"
        expected: "строка с pam_pwquality.so в common-password"
        ok: "{{ pam_pwquality_line != '' }}"
      control:
        value: "{{ pam_pwquality_actual.control }}"
        expected: "= {{ pam_pwquality_expected.control }}"
        ok: "{{ pam_pwquality_actual.control == pam_pwquality_expected.control }}"
      retry:
        value: "{{ pam_pwquality_actual.retry }}"
        expected: ">= {{ pam_pwquality_expected.retry }}"
        ok: "{{ (pam_pwquality_actual.retry | int(-1)) >= pam_pwquality_expected.retry }}"
      minlen:
        value: "{{ pam_pwquality_actual.minlen }}"
        expected: ">= {{ pam_pwquality_expected.minlen }}"
        ok: "{{ (pam_pwquality_actual.minlen | int(-1)) >= pam_pwquality_expected.minlen }}"
      ucredit:
        value: "{{ pam_pwquality_actual.ucredit }}"
        expected: "<= {{ pam_pwquality_expected.ucredit }}"
        ok: "{{ (pam_pwquality_actual.ucredit | int(1)) <= pam_pwquality_expected.ucredit }}"
      lcredit:
        value: "{{ pam_pwquality_actual.lcredit }}"
        expected: "<= {{ pam_pwquality_expected.lcredit }}"
        ok: "{{ (pam_pwquality_actual.lcredit | int(1)) <= pam_pwquality_expected.lcredit }}"
      dcredit:
        value: "{{ pam_pwquality_actual.dcredit }}"
        expected: "<= {{ pam_pwquality_expected.dcredit }}"
        ok: "{{ (pam_pwquality_actual.dcredit | int(1)) <= pam_pwquality_expected.dcredit }}"
      ocredit:
        value: "{{ pam_pwquality_actual.ocredit }}"
        expected: "<= {{ pam_pwquality_expected.ocredit }}"
        ok: "{{ (pam_pwquality_actual.ocredit | int(1)) <= pam_pwquality_expected.ocredit }}"

- name: Generate PAM common-password report
  ansible.builtin.template:
    src: pam_common_password_report.j2
    dest: "{{ password_policy_reports_dir }}/{{ inventory_hostname }}/pam_common_password.txt"
  delegate_to: localhost
  become: false
