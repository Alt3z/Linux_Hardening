---
- name: Ensure libpam-pwquality is installed
  ansible.builtin.apt:
    name: libpam-pwquality
    state: present

- name: Build the pam_pwquality line
  ansible.builtin.set_fact:
    pam_pwquality_line: >-
      password
      {{ pam_pwquality_target.control }}
      pam_pwquality.so
      retry={{ pam_pwquality_target.retry }}
      minlen={{ pam_pwquality_target.minlen }}
      ucredit={{ pam_pwquality_target.ucredit }}
      lcredit={{ pam_pwquality_target.lcredit }}
      dcredit={{ pam_pwquality_target.dcredit }}
      ocredit={{ pam_pwquality_target.ocredit }}

- name: Ensure pam_pwquality line is present in common-password
  ansible.builtin.lineinfile:
    path: /etc/pam.d/common-password
    regexp: '^\s*password\s+\S+\s+pam_pwquality\.so'
    line: "{{ pam_pwquality_line }}"
    insertbefore: '^password\s+\[success=1'
