---
- name: Ensure per-host reports directory exists
  ansible.builtin.file:
    path: "{{ ssh_reports_dir }}/{{ inventory_hostname }}"
    state: directory
  delegate_to: localhost
  become: false

- name: Check .ssh directory permissions
  ansible.builtin.stat:
    path: "/home/{{ ansible_user }}/.ssh"
  register: ssh_dir_stat

- name: Check authorized_keys contains our public key
  ansible.builtin.command: >
    grep -qF "{{ lookup('file', ssh_verify_pubkey_file) }}" /home/{{ ansible_user }}/.ssh/authorized_keys
  register: authorized_keys_check
  changed_when: false
  failed_when: false

- name: Attempt root login via SSH (must fail)
  ansible.builtin.command: >
    ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=5
    -i {{ ssh_verify_privkey_file }} root@{{ ansible_host }} true
  delegate_to: localhost
  become: false
  register: root_login_attempt
  changed_when: false
  failed_when: false

- name: Attempt password-based login (must fail)
  ansible.builtin.command: >
    sshpass -p "{{ ansible_password }}" ssh
    -o PreferredAuthentications=password -o PubkeyAuthentication=no
    -o StrictHostKeyChecking=no -o ConnectTimeout=5
    {{ ansible_user }}@{{ ansible_host }} true
  delegate_to: localhost
  become: false
  register: password_login_attempt
  changed_when: false
  failed_when: false

- name: Attempt key-based login (must succeed)
  ansible.builtin.command: >
    ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=5
    -i {{ ssh_verify_privkey_file }} {{ ansible_user }}@{{ ansible_host }} true
  delegate_to: localhost
  become: false
  register: key_login_attempt
  changed_when: false
  failed_when: false

- name: Generate access verification report
  ansible.builtin.template:
    src: ssh_access_report.j2
    dest: "{{ ssh_reports_dir }}/{{ inventory_hostname }}/ssh_access.txt"
  delegate_to: localhost
  become: false
