---
- name: Ensure per-host reports directory exists
  ansible.builtin.file:
    path: "{{ ssh_reports_dir }}/{{ inventory_hostname }}"
    state: directory
  delegate_to: localhost
  become: false

- name: Check /var/log/auth.log exists
  ansible.builtin.stat:
    path: /var/log/auth.log
  register: auth_log_stat

- name: Count sshd-related lines in auth.log
  ansible.builtin.shell: grep -c sshd /var/log/auth.log
  register: auth_log_sshd_count
  changed_when: false
  failed_when: false
  when: auth_log_stat.stat.exists

- name: Get current time on the host
  ansible.builtin.command: date +%s
  register: host_current_time
  changed_when: false
  when: auth_log_stat.stat.exists

- name: Evaluate auth.log freshness (updated within the last 24h)
  ansible.builtin.set_fact:
    auth_log_fresh: "{{ ((host_current_time.stdout | int) - (auth_log_stat.stat.mtime | int)) < 86400 }}"
  when: auth_log_stat.stat.exists

- name: Generate auth.log report
  ansible.builtin.template:
    src: ssh_auth_log_report.j2
    dest: "{{ ssh_reports_dir }}/{{ inventory_hostname }}/ssh_auth_log.txt"
  delegate_to: localhost
  become: false
