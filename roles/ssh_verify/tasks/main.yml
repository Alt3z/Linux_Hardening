---
# ---------------------------------------------------------------------------
# Блок 1. Проверка эффективной конфигурации sshd (то, что реально применилось,
# а не то, что написано в файле — sshd -T разворачивает все дефолты и учитывает
# синтаксис, так надёжнее, чем grep по sshd_config)
# ---------------------------------------------------------------------------

- name: Get effective sshd configuration
  ansible.builtin.command: sshd -T
  register: sshd_effective_config
  changed_when: false

- name: Check PermitRootLogin is disabled
  ansible.builtin.assert:
    that:
      - "'permitrootlogin no' in sshd_effective_config.stdout | lower"
    fail_msg: "FAIL: PermitRootLogin не отключён на {{ inventory_hostname }}"
    success_msg: "OK: PermitRootLogin отключён"

- name: Check PasswordAuthentication is disabled
  ansible.builtin.assert:
    that:
      - "'passwordauthentication no' in sshd_effective_config.stdout | lower"
    fail_msg: "FAIL: PasswordAuthentication не отключена на {{ inventory_hostname }}"
    success_msg: "OK: PasswordAuthentication отключена"

- name: Check PubkeyAuthentication is enabled
  ansible.builtin.assert:
    that:
      - "'pubkeyauthentication yes' in sshd_effective_config.stdout | lower"
    fail_msg: "FAIL: PubkeyAuthentication не включена на {{ inventory_hostname }}"
    success_msg: "OK: PubkeyAuthentication включена"

# ---------------------------------------------------------------------------
# Блок 2. Проверка файлов и прав на хосте
# ---------------------------------------------------------------------------

- name: Check .ssh directory permissions
  ansible.builtin.stat:
    path: "/home/{{ ansible_user }}/.ssh"
  register: ssh_dir_stat

- name: Assert .ssh directory has mode 0700
  ansible.builtin.assert:
    that:
      - ssh_dir_stat.stat.exists
      - ssh_dir_stat.stat.mode == "0700"
    fail_msg: "FAIL: /home/{{ ansible_user }}/.ssh отсутствует или права не 0700 (текущие: {{ ssh_dir_stat.stat.mode | default('нет файла') }})"
    success_msg: "OK: права на .ssh корректны (0700)"

- name: Check authorized_keys contains our public key
  ansible.builtin.command: >
    grep -qF "{{ lookup('file', ssh_verify_pubkey_file) }}" /home/{{ ansible_user }}/.ssh/authorized_keys
  register: authorized_keys_check
  changed_when: false
  failed_when: false

- name: Assert public key is present in authorized_keys
  ansible.builtin.assert:
    that:
      - authorized_keys_check.rc == 0
    fail_msg: "FAIL: публичный ключ отсутствует в authorized_keys на {{ inventory_hostname }}"
    success_msg: "OK: публичный ключ найден в authorized_keys"

# ---------------------------------------------------------------------------
# Блок 3. Реальная проверка подключения "снаружи" — с control-ноды
# ---------------------------------------------------------------------------

- name: Attempt root login via SSH (must fail)
  ansible.builtin.command: >
    ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=5
    -i {{ ssh_verify_privkey_file }} root@{{ ansible_host }} true
  delegate_to: localhost
  become: false
  register: root_login_attempt
  changed_when: false
  failed_when: false

- name: Assert root login was rejected
  ansible.builtin.assert:
    that:
      - root_login_attempt.rc != 0
    fail_msg: "FAIL: вход под root ({{ ansible_host }}) прошёл, а должен быть отклонён!"
    success_msg: "OK: вход под root отклонён"

- name: Attempt password-based login (must fail, PasswordAuthentication is off)
  ansible.builtin.command: >
    sshpass -p "{{ ansible_password }}" ssh
    -o PreferredAuthentications=password -o PubkeyAuthentication=no
    -o StrictHostKeyChecking=no -o ConnectTimeout=5
    {{ ansible_user }}@{{ ansible_host }} true
  delegate_to: localhost
  become: false
  register: password_login_attempt
  changed_when: false
  failed_when: false

- name: Assert password login was rejected
  ansible.builtin.assert:
    that:
      - password_login_attempt.rc != 0
    fail_msg: "FAIL: вход по паролю ({{ ansible_host }}) прошёл, а должен быть отклонён!"
    success_msg: "OK: вход по паролю отклонён"

- name: Attempt key-based login (must succeed)
  ansible.builtin.command: >
    ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=5
    -i {{ ssh_verify_privkey_file }} {{ ansible_user }}@{{ ansible_host }} true
  delegate_to: localhost
  become: false
  register: key_login_attempt
  changed_when: false
  failed_when: false

- name: Assert key-based login succeeded
  ansible.builtin.assert:
    that:
      - key_login_attempt.rc == 0
    fail_msg: "FAIL: вход по ключу ({{ ansible_host }}) НЕ прошёл — это критично, доступ может быть потерян!"
    success_msg: "OK: вход по ключу работает"

# ---------------------------------------------------------------------------
# Итоговый отчёт
# ---------------------------------------------------------------------------

- name: Verification summary
  ansible.builtin.debug:
    msg: "✅ {{ inventory_hostname }} ({{ ansible_host }}): все проверки SSH hardening пройдены"
